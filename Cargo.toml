[package]
name = "fhir-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Core primitives, data types, and validation logic for Fast Healthcare Interoperability Resources (FHIR)."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Revanthshalon/fhir-core"
keywords = ["fhir", "health", "hl7", "medical", "interoperability"]
categories = ["data-structures", "encoding", "parser-implementations"]

[features]
default = ["r5", "serde"]
r5 = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0.229", optional = true, features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.151"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
