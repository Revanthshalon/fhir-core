name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-features --verbose

      - name: Verify documentation
        run: RUSTDOCFLAGS="-D missing_docs" cargo doc --no-deps --all-features

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Generate code coverage
        id: tarpaulin
        run: |
          COVERAGE=$(cargo tarpaulin --all-features --engine llvm --skip-clean | grep -o '[0-9.]*% coverage' | head -n1 | cut -d'%' -f1)
          echo "Coverage: ${COVERAGE}%"
          echo "percent=${COVERAGE}" >> $GITHUB_OUTPUT

      - name: Update Coverage Badge Gist
        if: ${{ env.GIST_SECRET != '' && vars.GIST_ID != '' }}
        env:
          GIST_SECRET: ${{ secrets.GIST_SECRET }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.GIST_ID }}
          filename: fhir-core-coverage.json
          label: coverage
          message: ${{ steps.tarpaulin.outputs.percent }}%
          valColorRange: ${{ steps.tarpaulin.outputs.percent }}
          minColorRange: 50
          maxColorRange: 100
